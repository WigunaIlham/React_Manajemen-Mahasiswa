<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#eff6ff",
                100: "#dbeafe",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const {useState, useEffect} = React;

      const StudentManager = () => {
        const [students, setStudents] = useState([]);
        const [formData, setFormData] = useState({
          name: "",
          nim: "",
          major: "",
          email: "",
        });
        const [editingId, setEditingId] = useState(null);
        const [searchTerm, setSearchTerm] = useState("");

        // Load data from localStorage on component mount
        useEffect(() => {
          const savedStudents = localStorage.getItem("students");
          if (savedStudents) {
            setStudents(JSON.parse(savedStudents));
          }
        }, []);

        // Save to localStorage whenever students change
        useEffect(() => {
          localStorage.setItem("students", JSON.stringify(students));
        }, [students]);

        // Filter students based on search term
        const filteredStudents = students.filter(
          (student) =>
            student.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            student.nim.toLowerCase().includes(searchTerm.toLowerCase()) ||
            student.major.toLowerCase().includes(searchTerm.toLowerCase()) ||
            student.email.toLowerCase().includes(searchTerm.toLowerCase())
        );

        const handleInputChange = (e) => {
          const {name, value} = e.target;
          setFormData({
            ...formData,
            [name]: value,
          });
        };

        const handleSubmit = (e) => {
          e.preventDefault();

          if (
            !formData.name ||
            !formData.nim ||
            !formData.major ||
            !formData.email
          ) {
            alert("Semua field harus diisi!");
            return;
          }

          if (editingId) {
            // Update existing student
            setStudents(
              students.map((student) =>
                student.id === editingId
                  ? {...formData, id: editingId}
                  : student
              )
            );
            setEditingId(null);
          } else {
            // Add new student
            const newStudent = {
              ...formData,
              id: Date.now().toString(),
            };
            setStudents([...students, newStudent]);
          }

          // Reset form
          setFormData({
            name: "",
            nim: "",
            major: "",
            email: "",
          });
        };

        const handleEdit = (student) => {
          setFormData({
            name: student.name,
            nim: student.nim,
            major: student.major,
            email: student.email,
          });
          setEditingId(student.id);

          // Scroll to form
          document
            .getElementById("student-form")
            .scrollIntoView({behavior: "smooth"});
        };

        const handleDelete = (id) => {
          if (
            window.confirm(
              "Apakah Anda yakin ingin menghapus data mahasiswa ini?"
            )
          ) {
            setStudents(students.filter((student) => student.id !== id));
          }
        };

        const cancelEdit = () => {
          setEditingId(null);
          setFormData({
            name: "",
            nim: "",
            major: "",
            email: "",
          });
        };

        return (
          <div className="min-h-screen bg-gray-50">
            {/* Header */}
            <header className="bg-white shadow-sm border-b">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <div className="flex flex-col md:flex-row md:items-center md:justify-between">
                  <div className="flex-1 min-w-0">
                    <h1 className="text-3xl font-bold text-gray-900">
                      Student Manager
                    </h1>
                    <p className="mt-2 text-lg text-gray-600">
                      Aplikasi sederhana untuk mengelola data mahasiswa
                    </p>
                  </div>
                  <div className="mt-4 flex md:mt-0 md:ml-4">
                    <span className="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white">
                      <i className="fas fa-users mr-2 text-gray-400"></i>
                      {students.length} Mahasiswa
                    </span>
                  </div>
                </div>
              </div>
            </header>

            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                {/* Form Section */}
                <div className="lg:col-span-1">
                  <div
                    id="student-form"
                    className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sticky top-8"
                  >
                    <div className="flex items-center mb-6">
                      <div
                        className={`p-2 rounded-lg ${
                          editingId
                            ? "bg-yellow-100 text-yellow-800"
                            : "bg-primary-100 text-primary-800"
                        }`}
                      >
                        <i
                          className={`fas ${
                            editingId ? "fa-edit" : "fa-user-plus"
                          } text-lg`}
                        ></i>
                      </div>
                      <h2 className="ml-3 text-xl font-semibold text-gray-900">
                        {editingId
                          ? "Edit Data Mahasiswa"
                          : "Tambah Data Mahasiswa"}
                      </h2>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-5">
                      <div>
                        <label
                          htmlFor="name"
                          className="block text-sm font-medium text-gray-700 mb-1"
                        >
                          Nama Lengkap
                        </label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i className="fas fa-user text-gray-400"></i>
                          </div>
                          <input
                            type="text"
                            id="name"
                            name="name"
                            value={formData.name}
                            onChange={handleInputChange}
                            className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                            placeholder="Masukkan nama lengkap"
                          />
                        </div>
                      </div>

                      <div>
                        <label
                          htmlFor="nim"
                          className="block text-sm font-medium text-gray-700 mb-1"
                        >
                          NIM
                        </label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i className="fas fa-id-card text-gray-400"></i>
                          </div>
                          <input
                            type="text"
                            id="nim"
                            name="nim"
                            value={formData.nim}
                            onChange={handleInputChange}
                            className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                            placeholder="Masukkan NIM"
                          />
                        </div>
                      </div>

                      <div>
                        <label
                          htmlFor="major"
                          className="block text-sm font-medium text-gray-700 mb-1"
                        >
                          Jurusan
                        </label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i className="fas fa-graduation-cap text-gray-400"></i>
                          </div>
                          <input
                            type="text"
                            id="major"
                            name="major"
                            value={formData.major}
                            onChange={handleInputChange}
                            className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                            placeholder="Masukkan jurusan"
                          />
                        </div>
                      </div>

                      <div>
                        <label
                          htmlFor="email"
                          className="block text-sm font-medium text-gray-700 mb-1"
                        >
                          Email
                        </label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i className="fas fa-envelope text-gray-400"></i>
                          </div>
                          <input
                            type="email"
                            id="email"
                            name="email"
                            value={formData.email}
                            onChange={handleInputChange}
                            className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                            placeholder="Masukkan email"
                          />
                        </div>
                      </div>

                      <div className="flex space-x-3 pt-2">
                        <button
                          type="submit"
                          className="flex-1 inline-flex justify-center items-center px-4 py-3 border border-transparent text-sm font-medium rounded-lg shadow-sm text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200"
                        >
                          <i
                            className={`fas ${
                              editingId ? "fa-save" : "fa-plus"
                            } mr-2`}
                          ></i>
                          {editingId ? "Update Data" : "Tambah Data"}
                        </button>
                        {editingId && (
                          <button
                            type="button"
                            onClick={cancelEdit}
                            className="inline-flex justify-center items-center px-4 py-3 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200"
                          >
                            <i className="fas fa-times mr-2"></i>
                            Batal
                          </button>
                        )}
                      </div>
                    </form>
                  </div>
                </div>

                {/* Student List Section */}
                <div className="lg:col-span-2">
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div className="px-6 py-5 border-b border-gray-200">
                      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                        <h2 className="text-xl font-semibold text-gray-900 mb-4 sm:mb-0">
                          Daftar Mahasiswa
                        </h2>
                        <div className="relative w-full sm:w-64">
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i className="fas fa-search text-gray-400"></i>
                          </div>
                          <input
                            type="text"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                            placeholder="Cari mahasiswa..."
                          />
                        </div>
                      </div>
                    </div>

                    {filteredStudents.length === 0 ? (
                      <div className="text-center py-12 px-6">
                        <div className="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-gray-100 mb-4">
                          <i className="fas fa-user-graduate text-gray-400 text-xl"></i>
                        </div>
                        <h3 className="text-lg font-medium text-gray-900 mb-2">
                          {searchTerm
                            ? "Data tidak ditemukan"
                            : "Belum ada data mahasiswa"}
                        </h3>
                        <p className="text-gray-500 max-w-md mx-auto">
                          {searchTerm
                            ? "Coba gunakan kata kunci lain atau hapus pencarian untuk melihat semua data."
                            : "Silakan tambahkan data mahasiswa menggunakan form di samping."}
                        </p>
                      </div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="min-w-full divide-y divide-gray-200">
                          <thead className="bg-gray-50">
                            <tr>
                              <th
                                scope="col"
                                className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                              >
                                Mahasiswa
                              </th>
                              <th
                                scope="col"
                                className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                              >
                                NIM
                              </th>
                              <th
                                scope="col"
                                className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                              >
                                Jurusan
                              </th>
                              <th
                                scope="col"
                                className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
                              >
                                Aksi
                              </th>
                            </tr>
                          </thead>
                          <tbody className="bg-white divide-y divide-gray-200">
                            {filteredStudents.map((student) => (
                              <tr
                                key={student.id}
                                className="hover:bg-gray-50 transition-colors duration-150"
                              >
                                <td className="px-6 py-4 whitespace-nowrap">
                                  <div className="flex items-center">
                                    <div className="flex-shrink-0 h-10 w-10 bg-primary-100 rounded-lg flex items-center justify-center">
                                      <i className="fas fa-user text-primary-600"></i>
                                    </div>
                                    <div className="ml-4">
                                      <div className="text-sm font-medium text-gray-900">
                                        {student.name}
                                      </div>
                                      <div className="text-sm text-gray-500">
                                        {student.email}
                                      </div>
                                    </div>
                                  </div>
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap">
                                  <div className="text-sm text-gray-900 font-mono">
                                    {student.nim}
                                  </div>
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap">
                                  <div className="text-sm text-gray-900">
                                    {student.major}
                                  </div>
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                  <div className="flex justify-end space-x-2">
                                    <button
                                      onClick={() => handleEdit(student)}
                                      className="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-lg text-white bg-yellow-500 hover:bg-yellow-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition-colors duration-200"
                                    >
                                      <i className="fas fa-edit mr-1"></i>
                                      Edit
                                    </button>
                                    <button
                                      onClick={() => handleDelete(student.id)}
                                      className="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-lg text-white bg-red-500 hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors duration-200"
                                    >
                                      <i className="fas fa-trash mr-1"></i>
                                      Hapus
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </main>

            {/* Footer */}
            <footer className="bg-white border-t mt-12">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <div className="flex flex-col md:flex-row justify-between items-center">
                  <p className="text-sm text-gray-500">
                    © 2023 Student Manager. Aplikasi manajemen data mahasiswa.
                  </p>
                  <div className="mt-2 md:mt-0 flex space-x-4">
                    <span className="text-sm text-gray-500">
                      Total: {students.length} mahasiswa
                    </span>
                  </div>
                </div>
              </div>
            </footer>
          </div>
        );
      };

      ReactDOM.render(<StudentManager />, document.getElementById("root"));
    </script>
  </body>
</html>
